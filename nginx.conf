server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router owns the routes, so any unknown path must fall back to the
    # SPA shell rather than 404. Without this, a deep link such as
    # /admin/rbac fails on reload or when opened directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so bundles can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise clients keep loading the old
    # bundle references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
